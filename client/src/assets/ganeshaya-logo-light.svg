<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 140" role="img" aria-labelledby="gs-light-title gs-light-desc">
  <title id="gs-light-title">Ganeshaya Stays</title>
  <desc id="gs-light-desc">Ganeshaya Stays luxury hotels and suites logo — light variant</desc>
  <defs>
    <!-- Gold gradient — identical to the original logo -->
    <linearGradient id="gsLightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE58F"/>
      <stop offset="30%"  stop-color="#D4AF37"/>
      <stop offset="70%"  stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#664600"/>
    </linearGradient>
    <!-- Navy badge fill — identical to the original logo -->
    <linearGradient id="gsLightNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="50%"  stop-color="#0284C7" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="gsLightBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- ── Ganesha badge — byte-for-byte identical to the original logo ── -->
  <g transform="translate(15 10)" filter="url(#gsLightBadgeShadow)">
    <rect width="110" height="110" rx="28"
          fill="url(#gsLightNavy)" stroke="url(#gsLightGold)" stroke-width="2.5"/>
    <rect x="8" y="8" width="94" height="94" rx="20"
          fill="none" stroke="url(#gsLightGold)" stroke-width=".75"
          stroke-dasharray="4 4" opacity=".6"/>
    <text x="55" y="80" font-family="Georgia, serif" font-size="62" font-weight="900"
          text-anchor="middle" fill="url(#gsLightGold)" opacity=".18">GS</text>
    <path d="M55 18 65 30H45Z M50 14h10l-2 4h-6Z" fill="url(#gsLightGold)"/>
    <circle cx="55" cy="10" r="3" fill="#FFE58F"/>
    <path d="M55 30C35 26 25 40 32 55c6 10 16 7 19 0
             M55 30c20-4 30 10 23 25-6 10-16 7-19 0
             M55 35Q52 50 48 60q-4 12 4 22 10 8 16-2 4-8-6-8-6 0-6 6"
          fill="none" stroke="url(#gsLightGold)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53 36h4v8l-2 3-2-3ZM44 54h6"
          fill="url(#gsLightGold)" stroke="url(#gsLightGold)"
          stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ── Wordmark — only GANESHAYA fill changes to warm ivory ── -->
  <g transform="translate(150)">
    <!-- GANESHAYA: warm ivory instead of dark navy #0F172A -->
    <text x="0" y="65"
          font-family="Georgia, serif" font-size="38" font-weight="800"
          letter-spacing="3" fill="#F5F0E8">GANESHAYA</text>
    <!-- Divider rule — gold, identical to original -->
    <line x1="2" y1="80" x2="330" y2="80"
          stroke="url(#gsLightGold)" stroke-width="2" stroke-linecap="round"/>
    <!-- STAYS — gold, identical to original -->
    <text x="3" y="108"
          font-family="sans-serif" font-size="22" font-weight="800"
          letter-spacing="12" fill="#805b08">STAYS</text>
    <!-- Subtitle — lightened for dark backgrounds -->
    <text x="4" y="125"
          font-family="sans-serif" font-size="10" font-weight="700"
          letter-spacing="2" fill="#C9B98A">LUXURY HOTELS &amp; SUITES</text>
  </g>
</svg>
